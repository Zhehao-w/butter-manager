name: Windows checks

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          pnpm format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run interface tests
        run: pnpm test:ui

      - name: Build interface
        run: pnpm build

      - name: Run isolated backend tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib

      - name: Check backend and desktop targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows app
        # The interface was already checked/built above; avoid Tauri CLI rebuilding it.
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --features tauri/custom-protocol

      - name: Upload PR Windows executable
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: butter-manager-windows-pr-${{ github.event.pull_request.number }}
          path: src-tauri/target/release/butter-manager.exe
          if-no-files-found: error
