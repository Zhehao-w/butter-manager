name: Project checks

on:
  push:
    branches: [main, master]
    tags: ['v[0-9]*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload assets to an existing Release (tag pushes publish automatically)
        type: boolean
        default: false
      release_tag:
        description: Existing vX.Y.Z tag; required when publishing
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') && !inputs.publish_release }}

jobs:
  linux:
    name: Linux frontend and core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.image.outputs.commit }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.tools/cargo-cache
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.publish_release && inputs.release_tag) || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt

      - name: Restore frontend downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/pnpm-store
            .tools/pnpm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Identify checkout and runner image
        id: image
        run: |
          echo "version=${ImageVersion:?}" >> "$GITHUB_OUTPUT"
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "cache-prefix=${{ runner.os }}-${{ runner.arch }}-${ImageVersion}-rust-v2-${{ hashFiles('rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore Rust build cache
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/cargo-cache/registry
            .tools/cargo-cache/git
            src-tauri/target
          # One complete cache per dependency set, rather than ~800 MB per commit.
          key: ${{ steps.image.outputs.cache-prefix }}-complete-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ steps.image.outputs.cache-prefix }}-partial-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
            ${{ steps.image.outputs.cache-prefix }}-complete-
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-rust-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-

      - name: Check Linux frontend and core
        run: bash scripts/Check-Cloud.sh

      - name: Test release publishing with isolated fixtures
        run: python3 -B -m unittest discover -s scripts -p 'test_publish_release.py' -v

      - name: Save complete Rust build cache
        if: success() && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/cargo-cache/registry
            .tools/cargo-cache/git
            src-tauri/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Preserve partial Rust cache after failure
        if: failure() && !cancelled() && steps.rust_cache.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true' && !contains(steps.rust_cache.outputs.cache-matched-key, '-partial-')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/cargo-cache/registry
            .tools/cargo-cache/git
            src-tauri/target
          key: ${{ steps.image.outputs.cache-prefix }}-partial-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}

  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.image.outputs.commit }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.tools/cargo-cache
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.publish_release && inputs.release_tag) || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt

      - name: Restore frontend downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/pnpm-store
            .tools/pnpm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Identify checkout and runner image
        id: image
        run: |
          if (-not $env:ImageVersion) { throw 'Missing runner image version.' }
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          $taskCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify checked out commit.' }
          "commit=$taskCommit" >> $env:GITHUB_OUTPUT
          "cache-prefix=${{ runner.os }}-${{ runner.arch }}-$env:ImageVersion-rust-v2-${{ hashFiles('rust-toolchain.toml') }}" >> $env:GITHUB_OUTPUT

      - name: Restore Rust build cache
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/cargo-cache/registry
            .tools/cargo-cache/git
            src-tauri/target
          # One complete cache per dependency set, rather than ~800 MB per commit.
          key: ${{ steps.image.outputs.cache-prefix }}-complete-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ steps.image.outputs.cache-prefix }}-partial-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
            ${{ steps.image.outputs.cache-prefix }}-complete-
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-rust-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          pnpm format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run interface tests
        run: pnpm test:ui

      - name: Build interface
        run: pnpm build

      - name: Run isolated backend tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib

      - name: Check backend and desktop targets
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $taskClippyOutput = cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format=json -- -D warnings
          $taskClippyExit = $LASTEXITCODE
          foreach ($taskClippyLine in $taskClippyOutput) {
            $taskClippyEvent = $taskClippyLine | ConvertFrom-Json
            if ($taskClippyEvent.reason -ne 'compiler-message') { continue }
            Write-Host $taskClippyEvent.message.rendered
            if ($taskClippyEvent.message.level -ne 'error') { continue }
            $taskClippyText = $taskClippyEvent.message.message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            $taskClippySpan = $taskClippyEvent.message.spans | Where-Object is_primary | Select-Object -First 1
            if ($taskClippySpan) {
              $taskClippyPath = $taskClippySpan.file_name.Replace('\', '/')
              if ($taskClippyPath.StartsWith('src/') -or $taskClippyPath.StartsWith('examples/')) { $taskClippyPath = "src-tauri/$taskClippyPath" }
              $taskClippyPath = $taskClippyPath.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(',', '%2C')
              Write-Host ("::error file={0},line={1},col={2}::{3}" -f $taskClippyPath, $taskClippySpan.line_start, $taskClippySpan.column_start, $taskClippyText)
            } else {
              Write-Host "::error::$taskClippyText"
            }
          }
          exit $taskClippyExit

      - name: Build Windows app
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name) || (inputs.publish_release && inputs.release_tag) || '' }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          EVENT_NAME: ${{ github.event_name }}
          PREPARE_RELEASE: ${{ github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:PUBLISH_RELEASE -eq 'true' -and -not $env:RELEASE_TAG) { throw 'Publishing requires an existing release tag.' }
          # Reuse the frontend already checked/built above.
          ./scripts/Build-PortableRelease.ps1 -SkipFrontendBuild -ExpectedTag $env:RELEASE_TAG -PortableZip:($env:PREPARE_RELEASE -eq 'true')

      - name: Verify Portable release package
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        run: ./scripts/Test-PortableRelease.ps1

      - name: Upload Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: butter-manager-windows-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || steps.image.outputs.commit }}
          path: artifacts/windows/butter-manager.exe
          if-no-files-found: error
          retention-days: 14

      # Preserve the build EXE for verification; the publisher uploads only ZIP + SHA256.
      - name: Preserve verified Release assets
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release-assets
          path: |
            artifacts/windows/butter-manager.exe
            artifacts/windows/butter-manager-v*-windows-x64-portable.zip
            artifacts/windows/butter-manager-v*-windows-x64-portable.zip.sha256
          if-no-files-found: error

      - name: Save complete Rust build cache
        if: success() && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/cargo-cache/registry
            .tools/cargo-cache/git
            src-tauri/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Preserve partial Rust cache after failure
        if: failure() && !cancelled() && steps.rust_cache.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true' && !contains(steps.rust_cache.outputs.cache-matched-key, '-partial-')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/cargo-cache/registry
            .tools/cargo-cache/git
            src-tauri/target
          key: ${{ steps.image.outputs.cache-prefix }}-partial-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}

  publish:
    needs: [linux, windows]
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name) || inputs.release_tag }}
      EXPECTED_COMMIT: ${{ needs.windows.outputs.commit }}
      LINUX_COMMIT: ${{ needs.linux.outputs.commit }}
      CREATE_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Check out verified publishing code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.windows.outputs.commit }}

      - name: Download verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-release-assets
          path: artifacts/windows

      - name: Verify assets and publish Release
        run: python3 -B scripts/publish_release.py
