name: Project checks

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload assets to an existing Release (never creates a tag or Release)
        type: boolean
        default: false
      release_tag:
        description: Existing vX.Y.Z tag; required when publishing
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && !inputs.publish_release }}

jobs:
  linux:
    name: Linux frontend and core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_HOME: ${{ github.workspace }}/.tools/cargo-cache
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.publish_release && inputs.release_tag) || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt

      - name: Restore frontend downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/pnpm-store
            .tools/pnpm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Identify checkout and runner image
        id: image
        run: |
          echo "version=${ImageVersion:?}" >> "$GITHUB_OUTPUT"
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore Rust build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/cargo-cache/registry
            .tools/cargo-cache/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-rust-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-${{ steps.image.outputs.commit }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-rust-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-

      - name: Check Linux frontend and core
        run: bash scripts/Check-Cloud.sh

  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.tools/cargo-cache
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.publish_release && inputs.release_tag) || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt

      - name: Restore frontend downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/pnpm-store
            .tools/pnpm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Identify checkout and runner image
        id: image
        run: |
          if (-not $env:ImageVersion) { throw 'Missing runner image version.' }
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          $taskCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify checked out commit.' }
          "commit=$taskCommit" >> $env:GITHUB_OUTPUT

      - name: Restore Rust build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/cargo-cache/registry
            .tools/cargo-cache/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-rust-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-${{ steps.image.outputs.commit }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-rust-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          pnpm format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run interface tests
        run: pnpm test:ui

      - name: Build interface
        run: pnpm build

      - name: Run isolated backend tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib

      - name: Check backend and desktop targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows app
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.publish_release && inputs.release_tag) || '' }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          EVENT_NAME: ${{ github.event_name }}
          PREPARE_RELEASE: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:PUBLISH_RELEASE -eq 'true' -and -not $env:RELEASE_TAG) { throw 'Publishing requires an existing release tag.' }
          # Reuse the frontend already checked/built above.
          ./scripts/Build-PortableRelease.ps1 -SkipFrontendBuild -ExpectedTag $env:RELEASE_TAG -PortableZip:($env:PREPARE_RELEASE -eq 'true')

      - name: Upload Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: butter-manager-windows-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || steps.image.outputs.commit }}
          path: artifacts/windows/butter-manager.exe
          if-no-files-found: error
          retention-days: 14

      - name: Preserve verified Release assets
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release-assets
          path: |
            artifacts/windows/butter-manager.exe
            artifacts/windows/butter-manager-v*-windows-x64-portable.zip
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-release-assets
          path: artifacts/windows

      - name: Verify checksums and upload to existing Release
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag.' }
          $assets = @('butter-manager.exe', "butter-manager-$env:RELEASE_TAG-windows-x64-portable.zip")
          $checksums = @(Get-Content -LiteralPath artifacts/windows/SHA256SUMS.txt)
          if ($checksums.Count -ne 2) { throw 'Expected two checksums.' }
          $names = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($line in $checksums) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'Invalid checksum line.' }
            $expected = $Matches[1]
            $name = $Matches[2]
            if (-not $names.Add($name)) { throw 'Duplicate checksum entry.' }
            if ($assets -cnotcontains $name) { throw 'Unexpected release asset.' }
            if ((Get-FileHash -LiteralPath (Join-Path artifacts/windows $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Asset checksum mismatch.' }
          }
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { throw 'The Release must already exist; nothing will be created.' }
          gh release upload $env:RELEASE_TAG artifacts/windows/butter-manager.exe "artifacts/windows/butter-manager-$env:RELEASE_TAG-windows-x64-portable.zip" artifacts/windows/SHA256SUMS.txt --clobber --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
